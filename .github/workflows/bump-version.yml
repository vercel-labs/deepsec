name: Bump deepsec version

run-name: Bump deepsec version (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: bump-deepsec-version
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packagePath = "packages/deepsec/package.json";
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(packageJson.version);
          const bumpType = process.env.BUMP_TYPE;

          if (!match) {
            throw new Error(`Expected a stable semantic version, got ${packageJson.version}`);
          }
          if (!["patch", "minor", "major"].includes(bumpType)) {
            throw new Error(`Unsupported bump type: ${bumpType}`);
          }

          let [, major, minor, patch] = match.map(Number);
          if (bumpType === "major") {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (bumpType === "minor") {
            minor += 1;
            patch = 0;
          } else {
            patch += 1;
          }

          const currentVersion = packageJson.version;
          const newVersion = `${major}.${minor}.${patch}`;
          packageJson.version = newVersion;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `current=${currentVersion}\nnew=${newVersion}\nbranch=release/deepsec-v${newVersion}\n`,
          );
          NODE

      - name: Create signed commit and pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.version.outputs.branch }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          base_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" \
            --jq '.object.sha')
          branch_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" \
            --jq '.object.sha' 2>/dev/null || true)

          if [ -z "$branch_sha" ]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$base_sha" \
              >/dev/null
            branch_sha="$base_sha"
          fi

          content=$(base64 -w 0 packages/deepsec/package.json)
          remote_content=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/packages/deepsec/package.json?ref=$BRANCH" \
            --jq '.content' | tr -d '\n')

          if [ "$content" != "$remote_content" ]; then
            mutation='
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    signature {
                      isValid
                      wasSignedByGitHub
                    }
                  }
                }
              }
            '
            response=$(jq -n \
              --arg query "$mutation" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$BRANCH" \
              --arg expectedHeadOid "$branch_sha" \
              --arg message "Bump deepsec to $NEW_VERSION" \
              --arg path "packages/deepsec/package.json" \
              --arg contents "$content" \
              '{
                query: $query,
                variables: {
                  input: {
                    branch: {
                      repositoryNameWithOwner: $repository,
                      branchName: $branch
                    },
                    expectedHeadOid: $expectedHeadOid,
                    message: {
                      headline: $message
                    },
                    fileChanges: {
                      additions: [{
                        path: $path,
                        contents: $contents
                      }]
                    }
                  }
                }
              }' | gh api graphql --input -)

            commit_sha=$(jq -r '.data.createCommitOnBranch.commit.oid' <<< "$response")
            signature_valid=$(jq -r \
              '.data.createCommitOnBranch.commit.signature.isValid' <<< "$response")
            signed_by_github=$(jq -r \
              '.data.createCommitOnBranch.commit.signature.wasSignedByGitHub' <<< "$response")

            if [ "$signature_valid" != "true" ] || [ "$signed_by_github" != "true" ]; then
              echo "::error::GitHub did not return a valid GitHub-signed commit"
              exit 1
            fi
          else
            commit_sha="$branch_sha"
            echo "::notice::$BRANCH already contains deepsec@$NEW_VERSION"
          fi

          pr_url=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "Bump deepsec to $NEW_VERSION" \
              --body "Increases the deepsec package version from $CURRENT_VERSION to $NEW_VERSION. Merging this PR triggers the release workflow.")
          fi

          # Events created by GITHUB_TOKEN normally do not start new workflow
          # runs. workflow_dispatch is an explicit exception, so dispatch CI
          # against the PR branch to attach required checks to its head commit.
          gh workflow run ci.yml --ref "$BRANCH"

          {
            echo "### Version bump pull request"
            echo
            echo "- Version: \`$CURRENT_VERSION\` → \`$NEW_VERSION\`"
            echo "- Signed commit: \`$commit_sha\`"
            echo "- Pull request: $pr_url"
            echo "- CI: dispatched for \`$BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
