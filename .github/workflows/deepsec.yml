name: deepsec

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff against"
        required: true
        default: "origin/main"

# Default to read-only at the workflow level. This workflow is manual-only
# because deepsec executes repository-controlled config/plugins as code and
# must not expose AI credentials to unreviewed pull_request contents.
permissions:
  contents: read

jobs:
  analyze:
    environment: deepsec-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # need history for `git diff origin/<base>`

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }

      # Install + bundle the in-repo deepsec package so .deepsec/'s
      # `link:../packages/deepsec` resolves to a real `dist/cli.mjs`.
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle

      # `.deepsec/` has its own pnpm-workspace.yaml severing it from the
      # root workspace (so external repos can drop it in unchanged), so
      # it needs its own install pass to materialize node_modules/.bin/deepsec.
      - run: pnpm install --frozen-lockfile
        working-directory: .deepsec

      - run: npm install -g @anthropic-ai/claude-code

      # Run from .deepsec/ so the CLI loads .deepsec/deepsec.config.ts
      # (custom matchers + project list) and reads/writes the committed
      # `.deepsec/data/` state — same path local dev takes.
      #
      # BASE_REF goes through env, not GitHub-expression interpolation, so
      # a base ref containing shell metacharacters can't be parsed as
      # extra commands. Quoted in the shell for the same reason.
      - id: deepsec
        working-directory: .deepsec
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CLAUDE_CODE_EXECUTABLE: claude
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          pnpm exec deepsec process --agent codex \
            --diff "${BASE_REF}" \
            --comment-out ../comment.md

      # Upload the comment body as an artifact for manual inspection.
      - if: always() && hashFiles('comment.md') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepsec-comment
          path: comment.md
          retention-days: 1
