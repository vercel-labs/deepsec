# TEMPORARY: prints the Vercel team/project IDs behind the live-sandbox
# secrets so they can be reconciled with the dashboard. These are
# identifiers, not credentials. Delete this branch after use.
# Does not use or print VERCEL_TOKEN.
name: Debug print sandbox IDs

on:
  push:
    branches: [debug/print-sandbox-ids]

permissions:
  contents: read

jobs:
  print-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Print IDs
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -u
          # GitHub masks exact secret values; hex bytes are not masked.
          for name in VERCEL_TEAM_ID VERCEL_PROJECT_ID; do
            val="${!name}"
            echo "$name length=$(printf '%s' "$val" | wc -c)"
            echo "$name hex=$(printf '%s' "$val" | od -An -tx1 | tr -d ' \n')"
          done
